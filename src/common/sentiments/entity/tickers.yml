# Cashtags that collide with common English words. Cashtag-search adapters (Bluesky) must
# require the literal "$" prefix for these and never fall back to bare-word matching (spec §2.3).
ambiguous_tickers:
  - ALL
  - IT
  - "ON" # quoted -- YAML 1.1 parses the bare word "on" as a boolean True
  - NOW
  - GOOD
  - LOVE
  - CAR
  - KEY
  - REAL
  - OPEN
  - PLAY
  - WORK
  - FAST
  - SO
  - ARE
