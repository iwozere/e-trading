# src/common/sentiments/entity/tickers.yml
#
# Curated ticker <-> company/product name entity map. Seeded with the largest listed tech
# companies (see sentiment-spec-rev2.md §2.4: "Seed the map with the 100-150 largest listed
# tech companies. Accept that coverage stops there.").
#
# `entities`: used by the Hacker News adapter's name-based matching. HN text never contains a
#   ticker symbol -- only `names`/`products` are matched, whole-word and case-insensitive.
# `ambiguous_tickers`: a *different*, flat list of cashtags that collide with common English
#   words (spec §2.3). Cashtag-search adapters (Bluesky) require the literal `$` prefix for
#   these and must not fall back to bare-name matching.
#
# Adding a ticker: keep `names`/`products` specific enough to avoid false positives in
# general-purpose text (see COIN below for why "coin" alone is excluded).

