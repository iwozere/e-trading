# P22 Biotech M&A — hand-curated acquirer universe (spec §2.0.4, §4.1).
#
# DRAFT, 2026-08-30 (list count reviewed with the user 2026-08-31 — now 25,
# matching spec's "~25 acquirers" target). Spec §2.0.4 explicitly
# calls for a HAND-CURATED list "with entry/exit dates so a company isn't
# treated as a possible acquirer before it reached acquirer scale (or after
# it was itself acquired)" — this draft supplies 25 companies whose
# identity as large-cap serial biotech/pharma acquirers is uncontroversial
# public knowledge, but does NOT supply real entry/exit dates: every
# `entry_date` below is a placeholder set to the backtest's own start date
# (spec §2.0.1: "walk every quarter from 2010"), not a researched
# "when did this company actually reach acquirer scale" determination.
# **User decision 2026-08-31:** since none of these 25 companies has itself
# been acquired, `exit_date: null` is accepted as correct for all of them;
# the 2010-01-01 `entry_date` placeholder (except AbbVie's real 2013 spinoff
# anchor) is accepted as "good enough for now" rather than individually
# researched — all 25 are mega-caps plausibly already at acquirer scale by
# 2010. Revisit only if a specific company's pre-2010 status becomes
# material to a real score. This does NOT mean Block A (spec §4.1) is ready
# to run against this file: `cash_capacity`/`equity_capacity` still need real
# market-cap/financial data (the vendor decision, docs/Tasks.md item 1), not
# just entry/exit dates.
#
# `cik` values live-verified 2026-08-31 against SEC's own
# company_tickers.json (US-registrant tickers) and, for the 3 that weren't
# in that file, a direct EDGAR company-name search for a 20-F filer — Roche,
# Bayer, and Ipsen genuinely have no SEC CIK (their US ADRs — RHHBY, BAYRY —
# are unsponsored programs set up by a depositary bank, not a direct SEC
# registration by the company itself; confirmed by an empty EDGAR company
# search, not just an unmatched ticker lookup). `null` for those three is a
# verified fact, not an unverified gap — see the per-entry comments below.
#
# `bloc` values feed the §4.4.1 foreign-investment-screening gate
# (`us` | `allied` | `neutral` | `elevated_scrutiny`) — assigned here from
# each company's public headquarters/domicile, which is low-risk factual
# information, unlike the entry/exit dates above.
#
# Per spec §3.5: "Changes to this file bump config_hash and require a re-score."

