# P22 Biotech M&A — controlled vocabulary: modality (spec §3.5).
#
# DRAFT, 2026-08-30 — spec §3.5 names this file but gives no example values
# (unlike therapeutic_area.yaml, which gets a partial list). This is a
# reasonable standard drug-modality taxonomy, NOT sourced from any value the
# spec itself provides — needs a domain reviewer's sign-off before relying
# on it for base-rate lookups or Block D's `modality_capability(acquirer,
# target.modality)` term (spec §4.4). Logged as an open decision in
# docs/Tasks.md.
#
# UPDATE 2026-09-08 — added `unclassified`, NOT part of the original draft.
# `ingest/modality_classifier.py`'s best-effort keyword classifier (built for
# `ingest/asset_normalization.py`, mirroring `therapeutic_area_classifier.py`'s
# exact precedent) needs a value to return when an intervention's name matches
# none of its keyword rules. Unlike `therapeutic_area` (`NOT NULL`),
# `p22_asset.modality` IS nullable — `NULL` would have worked mechanically —
# but writing the explicit `unclassified` marker is more informative than a
# bare `NULL`: it distinguishes "classification was attempted and failed" from
# "never attempted," same reasoning as `therapeutic_area.yaml`'s identical
# addition. Treat any asset row classified `unclassified` as needing manual
# review before trusting it in a Block D computation that branches on modality.
#
# Per spec §3.5: "Changes to this file bump config_hash and require a re-score."

values:
  - unclassified             # classifier fallback, not a spec-given value — see note above
  - small_molecule
  - biologic_antibody         # mAb, bispecific, ADC payload-carrier
  - antibody_drug_conjugate
  - gene_therapy
  - cell_therapy               # CAR-T, TCR-T, TIL, allogeneic
  - rna_therapeutic             # siRNA, ASO, mRNA
  - vaccine
  - radioligand
  - peptide
  - protein_replacement
  - device_combination          # drug-device combination products
