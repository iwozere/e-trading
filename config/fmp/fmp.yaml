# FMP historical data pipeline — planner/run settings (spec Appendix B, docs/FMP_DATA_PIPELINE_SPEC-2.md).
# Every key is optional; omitted keys use the defaults in src/data/fmp_pipeline/planner/config.py.
# The API key is NOT configured here: it is read from the FMP_API_KEY environment variable / .env only.
fmp:
  dump_id: "2026-10"
  base_url: https://financialmodelingprep.com/stable/
  rate_limit_per_min: 2400       # 80% of Ultimate's 3,000 (owner upgraded Premium -> Ultimate 2026-10-17)
  workers: 32                    # 12 workers sustained ~595/min against the 600 limit; 2,400/min needs more in flight
  priorities: [P0, P1]           # add P2 only if the budget allows (spec §5)
  daily_from: 2000-01-01
  daily_window_years: 5          # one daily request per symbol and 5-year window (D37)
  page_size: 100                 # free key caps limit at 100; raise after the paid probe
  bandwidth:
    cap_gb: 150                  # Ultimate (Premium 50); trailing 30 days
    safety: 0.90
    basis: decoded               # 2026-10-17 dashboard: FMP counts ~0.75 decoded bytes, 5-9x the wire bytes (D77)
    window_days: 30
    scale: 0.85                  # dashboard bytes per local byte (0.71-0.84 per endpoint on 2026-10-17); `fmp calibrate-usage` overrides it
  intraday:
    interval: 5min               # owner 2026-10-17: try 5min first; probe-paid also measures 1hour as the fallback (D76)
    tiers: [A, B, C, D, E]
    tier_intervals: {D: 15min}   # owner 2026-10-17: D (delisted) at 15min, the rest 5min; run A, D, B, C, E (D78)
    earliest: earliest           # first daily bar; set a date if the paid probe shows a fixed 1h depth
    max_rows: null               # row cap per request: SET FROM THE PAID PROBE; until then no intraday task is written
    bars_per_day: null           # null = full session at the interval (7 for 1hour, 78 for 5min); the paid probe measures it
    assumed_max_rows: 2000       # used only for the projection while max_rows is null
    wire_bytes_per_row: 18       # assumed until the paid probe measures the interval's responses
    decoded_bytes_per_row: 110
  universe:
    include_otc: false
    keep_unresolved: false
    # Normalized codes (upper case, no spaces/dashes/dots). Check universe_report.md "Exchanges seen" after the
    # first paid plan and add any US venue FMP spells differently.
    include_exchanges: [NASDAQ, NYSE, AMEX, NYSEAMERICAN, NYSEARCA, ARCA, BATS, CBOE, CBOEBZX]
    # Index prices (^GSPC, ^IXIC, ^DJI, ^VIX, ^RUT) are plan_restricted on Premium (paid probe 2026-10-17): the
    # owner takes them from yfinance, so they are left out of tier A and of the universe.
    tier_a: [SPY, QQQ, IWM, DIA, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
    indices: []
  build:                         # fmp build (spec §7); full list of keys in planner/config.py BuildConfig
    intraday_tz: America/New_York  # zone of FMP's intraday `date` strings [VERIFY in the paid probe, spec §8.4]
    intraday_label: start          # start | end: what the timestamp labels [VERIFY]
    segment_reused_tickers: false  # true only after the paid probe shows merged series for reused tickers (D46)
  adapter:                       # DataManager reads from the FMP vintage (docs/datamanager_integration.md)
    enabled: false               # keep false until WP-9 increments exist for live jobs (D50)
    data_root: ""                # "" = DATA_CACHE_DIR/fmp-data
    timeframes: [1d, 1h]         # served from FMP when the vintage has them; others stay on the legacy cache
  increments:                    # yfinance increment layer (spec §10, D56–D60)
    writer_host: ""              # host name of the ONE machine that ingests (owner decision Q4: the Pi); empty = nobody
    timeframes: [1d, 1h]
    overlap_days: 5              # re-downloaded only to verify stored bars, never to overwrite them
    verify_tolerance: 0.02       # overlap close differences above this are reported
  reconciliation_size: 300
  reconciliation_fixed: [AAPL, MSFT, TSLA, AMZN, NVDA, GOOGL, JPM, XOM, KO, T, GE, BRK-B]
