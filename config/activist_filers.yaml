# P22 Biotech M&A — known activist-fund CIKs (spec §2.6.2).
#
# Spec: "Maintain config/activist_filers.yaml — a list of CIKs for known activist funds. A 13D
# from a healthcare-specialist crossover fund at IPO is not the same event as a 13D from an
# activist with a campaign history, and the model must distinguish them." Target size: "~30
# healthcare-specialist CIKs."
#
# **Genuinely incomplete by design, not a guess** — same discipline as p22_acquirers.yaml before
# its 2026-08-31 curation pass. Seeded 2026-09-08 with 11 funds whose CIK was live-verified
# against SEC EDGAR's own company-search endpoint (a single, unambiguous CIK with a real SC 13D
# filing history) — not fabricated, but not vetted against a real "campaign history vs. crossover
# fund" distinction either, which needs a domain reviewer, not a mechanical check. Flagged here as
# a "Decisions needed" item in docs/Tasks.md.
#
# Grown 2026-09-08, later same day: the 4 generalist-activist names originally left out for
# resolving to multiple CIKs (Starboard Value, Icahn Enterprises, Third Point, JANA Partners) are
# now disambiguated — live-checked EACH candidate CIK's own `data.sec.gov/submissions` filing
# history (not just a name search) and picked the one(s) with a real, high-volume SC 13D filing
# history as the actual activist entity, discarding name-search matches that turned out to be
# unrelated companies these funds had filed 13Ds ABOUT (not their own filing identity) or
# low-activity affiliates:
#   - "Starboard Value & Opportunity Fund, LLC" (93 filings, 1 SC 13D) and "Cyxtera Technologies,
#     Inc." (312 filings, 12 SC 13D — a portfolio company Starboard filed 13Ds about, not
#     Starboard itself) were both discarded; "Starboard Value LP" (898 filings, 428 SC 13D) is the
#     real operating entity.
#   - "SiriusPoint Ltd" (874 filings, 8 SC 13D — a portfolio company, same pattern) discarded;
#     "Third Point LLC" (828 filings, 254 SC 13D) is real.
#   - "JANA Partners Management, LP" (80 filings, 4 SC 13D — looks like a newer/smaller successor
#     entity) discarded in favor of "JANA PARTNERS LLC" (850 filings, 238 SC 13D).
#   - BOTH Icahn entities kept — "Icahn Enterprises L.P." (1000 filings, 53 SC 13D) and "Icahn
#     Enterprises Holdings L.P." (629 filings, 10 SC 13D) are both real, independently-verified
#     Icahn-affiliated filing identities (unlike the discarded cases above, neither is an unrelated
#     company), and Icahn 13Ds are routinely co-filed across the group's affiliated entities.
#
# Still genuinely incomplete — 16 of spec's "~30" target — and none of these 16 (old or new) are
# vetted against the "campaign history vs. crossover fund" domain distinction spec asks for, only
# against "does this CIK actually file SC 13Ds as this fund." That remains a "Decisions needed"
